# ==============================================================================
# Nginx Virtual Host Configuration for Kids World CMS
# Domain: ezm.quocvu.com
# Target Path: /var/www/ezm.quocvu.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ezm.quocvu.com;

    root /home/quocvu88/domains/ezm.quocvu.com/public;
    index index.php index.html;

    # Maximum file upload size (matches PHP post_max_size / upload_max_filesize)
    client_max_body_size 64M;

    # Character set
    charset utf-8;

    # Logging
    access_log /var/log/nginx/ezm.quocvu.com.access.log;
    error_log /var/log/nginx/ezm.quocvu.com.error.log warn;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static uploads and media caching (images, audio packs)
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Static assets (images, icons, fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|mp3|wav|ogg)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # Main routing to front controller (public/index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # FastCGI socket - matches PHP-FPM socket on Ubuntu (e.g. php8.2-fpm or php8.3-fpm)
        # Note: Managed dynamically by setup script via php-fpm.sock symlink or specific version
        fastcgi_pass unix:/run/php/php-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts for heavy AI generation requests
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_connect_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to sensitive files and directories
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to internal source, data and deploy folders
    location ~ ^/(data|src|docs|deploy)($|/) {
        deny all;
        return 404;
    }

    # Block access to database and environment files
    location ~* \.(sqlite|sqlite3|db|env|log|sh|sql)$ {
        deny all;
        return 404;
    }
}
